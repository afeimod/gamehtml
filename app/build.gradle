plugins {
    id 'com.android.application'
}

android {
    namespace 'com.game4399.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.game4399.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // WebView 调试开关（release 默认关）
        buildConfigField "boolean", "ENABLE_WEBVIEW_DEBUG", "false"

        // 不压缩 wasm / data, 避免启动性能变差
        ndk {
            def abiList = project.findProperty("abiList") ?: 'arm64-v8a,armeabi-v7a,x86,x86_64'
            abiFilters abiList.split(',')
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "boolean", "ENABLE_WEBVIEW_DEBUG", "true"
        }
        release {
            minifyEnabled false   // 关闭混淆，HTML/JS 里不能被 R8 改
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress 'wasm', 'data', 'js'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
