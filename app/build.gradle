plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.flashbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.flashbox.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        vectorDrawables { useSupportLibrary true }
        resConfigs 'zh', 'en'
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Room database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
}

// ===========================================================================
// Engine assets: download the prebuilt Ruffle selfhosted build into assets,
// and copy the bundled Waflash player into assets. Run automatically before
// the preBuild task so a clean checkout builds out of the box.
//
// If Ruffle download fails, the build continues (runtime download fallback
// exists in EngineAssets.kt). Waflash is copied from the project's engines/
// directory and should always succeed.
// ===========================================================================
def ruffleTagDate = "2024-01-28"       // tag uses hyphens: nightly-2024-01-28
def ruffleFileDate = "2024_01_28"      // filename uses underscores: 2024_01_28
def ruffleAssetDir = file("src/main/assets/engines/ruffle")
def waflashSrcDir = rootProject.file("engines/waflash")
def waflashAssetDir = file("src/main/assets/engines/waflash")

task downloadRuffle {
    doLast {
        def dest = new File(buildDir, "ruffle/ruffle-selfhosted-${ruffleFileDate}.zip")
        dest.parentFile.mkdirs()

        // Skip if already extracted
        def ruffleJs = new File(ruffleAssetDir, "ruffle.js")
        if (ruffleJs.exists() && ruffleJs.length() > 0) {
            println "Ruffle already extracted, skipping download"
            return
        }

        def url = "https://github.com/ruffle-rs/ruffle/releases/download/nightly-${ruffleTagDate}/ruffle-nightly-${ruffleFileDate}-web-selfhosted.zip"
        def maxRetries = 3
        def downloaded = false

        for (int attempt = 1; attempt <= maxRetries; attempt++) {
            try {
                println "Downloading Ruffle selfhosted (attempt ${attempt}/${maxRetries}) from ${url}"
                def conn = new URL(url).openConnection()
                conn.setConnectTimeout(30000)
                conn.setReadTimeout(60000)
                conn.setInstanceFollowRedirects(true)
                dest.withOutputStream { os -> conn.getInputStream().withStream { is -> os << is } }
                downloaded = true
                println "Downloaded ${dest.length()} bytes"
                break
            } catch (Exception e) {
                println "Attempt ${attempt} failed: ${e.message}"
                if (attempt < maxRetries) {
                    sleep(2000)
                }
            }
        }

        if (downloaded && dest.exists() && dest.length() > 0) {
            ruffleAssetDir.mkdirs()
            ant.unzip(src: dest, dest: ruffleAssetDir) {
                patternset() {
                    include(name: '**/*')
                }
            }
            println "Ruffle assets extracted to ${ruffleAssetDir}"
            // Verify
            if (ruffleJs.exists() && ruffleJs.length() > 0) {
                println "Ruffle ruffle.js verified: ${ruffleJs.length()} bytes"
            } else {
                println "WARNING: ruffle.js not found after extraction"
            }
        } else {
            println "WARNING: Ruffle download failed after ${maxRetries} attempts."
            println "The app will attempt runtime download on first launch."
            println "Or manually download from: ${url}"
        }
    }
}

task copyWaflash {
    doLast {
        waflashAssetDir.mkdirs()
        if (waflashSrcDir.exists()) {
            copy {
                from waflashSrcDir
                into waflashAssetDir
            }
            println "Waflash assets copied to ${waflashAssetDir}"
            // Verify
            def waflashJs = new File(waflashAssetDir, "waflash.js")
            if (waflashJs.exists()) {
                println "Waflash waflash.js verified: ${waflashJs.length()} bytes"
            }
        } else {
            println "WARNING: Waflash source dir not found at ${waflashSrcDir}."
            println "Waflash engine will not be available."
        }
    }
}

preBuild.dependsOn downloadRuffle, copyWaflash
