plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flashbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.flashbox.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug-signed with default keystore. For real release, supply your own keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0', 'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    // Asset ignore patterns: AGP ignores .svn/.git/Thumbs.db/etc. by default,
    // so we no longer set this explicitly. Earlier versions of this file used
    // `aaptOptions.ignoreAssetsPattern` (deprecated) and
    // `androidResources.ignoreAssetsPatterns` (only in AGP 8.3+); both caused
    // "method not found" errors on AGP 8.2.x, so we just omit the block and
    // rely on AGP defaults.

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
}
