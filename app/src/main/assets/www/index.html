<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0F1015">
<meta name="format-detection" content="telephone=no">
<title>Flash 游戏盒</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<!-- Top bar -->
<header class="topbar" id="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
  </button>
  <div class="brand">
    <div class="logo">FB</div>
    <div class="brand-text">
      <div class="title">Flash 游戏盒</div>
      <div class="subtitle" id="subtitle">已就绪</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="searchBtn" aria-label="搜索">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.49-1.49-5-5zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <button class="icon-btn" id="historyBtn" aria-label="历史">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm-1 5v5l4.25 2.52.75-1.23L13.5 12V8z"/></svg>
    </button>
    <button class="icon-btn" id="favBtn" aria-label="收藏">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18z"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94 0-.32-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2.5h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.69 8.98a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.62-.06.94 0 .32.02.63.06.94L2.81 14.6a.49.49 0 0 0-.12.61l1.92 3.32a.49.49 0 0 0 .59.22l2.39-.96c.5.39 1.03.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96a.49.49 0 0 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
    </button>
  </div>
</header>

<!-- Side menu (drawer) -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer-panel">
    <div class="drawer-header">
      <div class="brand">
        <div class="logo">FB</div>
        <div>
          <div class="title">Flash 游戏盒</div>
          <div class="subtitle" id="versionLabel">v1.0.0</div>
        </div>
      </div>
    </div>
    <ul class="drawer-list">
      <li data-go="home"><span class="mi">🏠</span> 首页</li>
      <li data-go="local"><span class="mi">📂</span> 本地游戏</li>
      <li data-go="history"><span class="mi">🕘</span> 历史记录</li>
      <li data-go="favorites"><span class="mi">⭐</span> 收藏</li>
      <li data-go="defaultpages"><span class="mi">🌐</span> 默认网页</li>
      <li data-go="custompages"><span class="mi">➕</span> 自定义网页</li>
      <li data-go="engine"><span class="mi">⚙️</span> 引擎设置</li>
      <li data-go="vpad"><span class="mi">🎮</span> 虚拟按键</li>
      <li data-go="adblock"><span class="mi">🛡️</span> 广告拦截</li>
      <li data-go="about"><span class="mi">ℹ️</span> 关于</li>
    </ul>
    <div class="drawer-footer">
      <span id="deviceLabel"></span>
    </div>
  </nav>
</aside>

<!-- Main scrollable content -->
<main class="content" id="content">
  <!-- Search bar (hidden by default) -->
  <div class="search-bar hidden" id="searchBar">
    <input type="search" id="searchInput" placeholder="搜索游戏 / URL..." />
    <button class="icon-btn" id="searchClose">✕</button>
  </div>

  <!-- Home / Featured / Local / History / etc. all live here -->
  <div id="pageRoot" class="page-root"></div>
</main>

<!-- Toast/snackbar -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Modal host -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>

<!-- Virtual Gamepad host (only used on play page) -->
<div id="vpadHost"></div>

<!-- Page-change progress -->
<div id="pageProgress" class="page-progress hidden"></div>

<!-- Scripts -->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="modules/adblock.js"></script>
<script src="modules/history.js"></script>
<script src="modules/favorites.js"></script>
<script src="modules/localfiles.js"></script>
<script src="modules/engines.js"></script>
<script src="modules/vpad.js"></script>
<script src="modules/keyboardpicker.js"></script>
<script src="modules/quality.js"></script>
<script src="modules/defaultpages.js"></script>
<script src="modules/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
