<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  #stage canvas, #stage ruffle-player {
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif !important;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>

  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');  // ruffle
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var ruffleUrl = CDN_URL || 'https://flash.local/ruffle/ruffle.js';
    var rufflePath = CDN_PATH || 'https://flash.local/ruffle/';

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      "letterbox": "fullscreen",
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      "scale": "showAll",
      "quality": "high",
      "allowFullscreen": false,
      "splashScreen": true,
      "preloader": true,
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    // CDN 模式下无本地字体文件，跳过
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [rufflePath + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        var opt = { url: SWF_URL, allowScriptAccess: true };
        if (BASE_URL) opt.base = BASE_URL;
        player.ruffle().load(opt);
        document.getElementById('loading').style.display = 'none';
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error(e);
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        var opt = { url: url, allowScriptAccess: true };
        if (base) opt.base = base;
        player.ruffle().load(opt);
      } catch(e) { console.error(e); }
    };

    // ===== 屏幕比例（aspect ratio）=====
    // mode: "fit" | "16:9" | "4:3" | "3:2" | "1:1"
    //
    // Ruffle 渲染 pipeline(读 ruffle-master 源码 + web/src/lib.rs 确认):
    //   1. <ruffle-player> 是 web component,内部有 shadow DOM 装 <canvas>
    //   2. 内部 main loop 每帧 tick 时读 instance.canvas.clientWidth/Height
    //      (即 <canvas> 元素的 CSS 渲染尺寸,由 web component 自身的 box 决定)
    //   3. 如果尺寸变了 → set_viewport_dimensions() → 内部 build_matrices()
    //      按 scale_mode(默认 ShowAll)+ letterbox(默认 Fullscreen)算 viewport 矩阵
    //   4. scale_mode 枚举(读 core/src/display_object/stage.rs:954):
    //      ShowAll | ExactFit | NoBorder | NoScale
    //   5. 关键限制(读 web/src/builder.rs:208):JS 端只能通过 Builder.setScale()
    //      在 load 之前改 scale_mode;**load 之后没有 set_scale_mode 的 JS 绑定**
    //   6. 同样:letterbox 也是 Builder 阶段,运行时改不到
    //
    // 所以"屏幕比例"实际 = 改 <ruffle-player> 的 CSS 尺寸,让 Ruffle 自动
    // 按 ShowAll 把 SWF 内容居中在那个尺寸的画布里(多余区域就是 Ruffle 的
    // letterbox 黑色填充)。这是真正能生效的方案。
    function parseAspectMode(mode) {
      if (!mode || mode === 'fit') return { kind: 'fit' };
      var parts = mode.split(':');
      if (parts.length !== 2) return { kind: 'fit' };
      var w = parseFloat(parts[0]);
      var h = parseFloat(parts[1]);
      if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) return { kind: 'fit' };
      return { kind: 'ratio', ratio: w / h };
    }

    function findRufflePlayer() {
      return document.querySelector('ruffle-player');
    }

    function applyAspectRatio(mode) {
      try {
        var m = parseAspectMode(mode);
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var player = findRufflePlayer();

        if (m.kind === 'fit') {
          // fit: 不动任何东西,跟原版 player.html 行为一致
          // (CSS #stage { inset:0; width:100%; height:100% } 已经让它撑满)
          return 'fit';
        }

        // ratio 模式:在视口内 contain 居中,ruffle-player 设成该比例尺寸
        var ratio = m.ratio;
        var boxRatio = vw / vh;
        var bw, bh;
        if (boxRatio > ratio) {
          bh = vh; bw = vh * ratio;
        } else {
          bw = vw; bh = vw / ratio;
        }
        bw = Math.round(bw);
        bh = Math.round(bh);

        if (player) {
          player.style.position = 'fixed';
          player.style.left = ((vw - bw) / 2) + 'px';
          player.style.top = ((vh - bh) / 2) + 'px';
          player.style.width = bw + 'px';
          player.style.height = bh + 'px';
          player.style.margin = '0';
        } else {
          // ruffle-player 还没出现,先动 stage 容器占位
          // 等 MutationObserver 触发再补救
        }
        stage.style.position = 'fixed';
        stage.style.inset = '0';
        stage.style.width = bw + 'px';
        stage.style.height = bh + 'px';
        stage.style.left = ((vw - bw) / 2) + 'px';
        stage.style.top = ((vh - bh) / 2) + 'px';
        return mode;
      } catch (e) {
        console.error('applyAspectRatio failed:', e);
        return null;
      }
    }

    // 窗口尺寸变化（旋转/全屏/分屏）时重应用当前比例
    var __currentAspectMode = 'fit';

    // 等 ruffle-player 加入 DOM 再应用比例
    // (Ruffle 加载 SWF 是异步的,可能几秒后才出现)
    // 关键:fit 模式等于"什么都不做",所以 fit 模式下即使 ruffle-player 没出现也无所谓
    function __observeRufflePlayer() {
      if (__currentAspectMode === 'fit') return; // fit 不动 ruffle-player,无需观察
      var existing = findRufflePlayer();
      if (existing) {
        setTimeout(function () { applyAspectRatio(__currentAspectMode); }, 200);
        return;
      }
      var mo = new MutationObserver(function (mutations, observer) {
        var p = findRufflePlayer();
        if (p) {
          observer.disconnect();
          setTimeout(function () { applyAspectRatio(__currentAspectMode); }, 300);
        }
      });
      mo.observe(document.body || document.documentElement, {
        childList: true,
        subtree: true,
      });
      setTimeout(function () { try { mo.disconnect(); } catch(e){} }, 10000);
    }

    window.addEventListener('resize', function () {
      if (__currentAspectMode && __currentAspectMode !== 'fit') {
        applyAspectRatio(__currentAspectMode);
      }
    });
    // 暴露给 Android 调用
    window.__applyAspectRatio = function (mode) {
      __currentAspectMode = mode || 'fit';
      __observeRufflePlayer();
      return applyAspectRatio(__currentAspectMode);
    };
    // 首次进入:如果 URL 带 ?ratio= 才需要等 ruffle-player
    var __initialRatio = param('ratio', null);
    if (__initialRatio) {
      __currentAspectMode = __initialRatio;
      __observeRufflePlayer();
    }

    // 禁用长按选择 / 上下文菜单 / 缩放
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
