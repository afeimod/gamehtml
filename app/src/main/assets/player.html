<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  /* Ruffle player 用 inline style 设绝对定位 + 100%×100% 填满 stage,
     这样改 stage 尺寸就能让 ruffle-player 跟着变。
     注意:CSS 不能用 !important 强制 width/height,因为 JS 改 ruffle-player
     自己的 style.width 时会被 !important 覆盖。改 stage 的尺寸,让 ruffle-player
     用 CSS 计算 clientWidth。 */
  #stage ruffle-player,
  #stage ruffle-object,
  #stage ruffle-embed,
  #stage canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    display: block;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>

  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');  // ruffle
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var ruffleUrl = CDN_URL || 'https://flash.local/ruffle/ruffle.js';
    var rufflePath = CDN_PATH || 'https://flash.local/ruffle/';

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      "letterbox": "fullscreen",
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      "scale": "showAll",
      "quality": "high",
      "allowFullscreen": false,
      "splashScreen": true,
      "preloader": true,
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    // CDN 模式下无本地字体文件，跳过
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [rufflePath + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        var opt = { url: SWF_URL, allowScriptAccess: true };
        if (BASE_URL) opt.base = BASE_URL;
        player.ruffle().load(opt);
        document.getElementById('loading').style.display = 'none';
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error(e);
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        var opt = { url: url, allowScriptAccess: true };
        if (base) opt.base = base;
        player.ruffle().load(opt);
      } catch(e) { console.error(e); }
    };

    // ===== 屏幕比例（aspect ratio）=====
    // 模式: fit / fill / 16:9 / 4:3 / 21:9 / 3:2 / 1:1 / stretch
    //
    // 实现: 改 ruffle-player 自身的 style (inline style 优先级高于 CSS),
    // Ruffle 内部 main loop 每帧 tick 时读 clientWidth/Height,
    // 看到变化就 set_viewport_dimensions + build_matrices 重算 viewport 矩阵。

    // 给 ruffle-player 自身设 inline style(优先级高于 CSS),
    // Android WebView 调度可能延迟,inline style 立即生效不被 layout 调度影响
    function applyAspectRatioPlayer(mode) {
      try {
        var m = mode || 'fit';
        var w = window.innerWidth;
        var h = window.innerHeight;
        var bw, bh, bt, bl;
        if (m === 'fit' || m === 'fill' || m === 'stretch') {
          bw = w; bh = h; bt = 0; bl = 0;
        } else {
          var ratio;
          if (m === '16:9') ratio = 16/9;
          else if (m === '4:3') ratio = 4/3;
          else if (m === '21:9') ratio = 21/9;
          else if (m === '3:2') ratio = 3/2;
          else if (m === '1:1') ratio = 1;
          else {
            var parts = m.split(':');
            if (parts.length === 2) {
              var a = parseFloat(parts[0]), b = parseFloat(parts[1]);
              if (isFinite(a) && isFinite(b) && a > 0 && b > 0) ratio = a / b;
              else ratio = w / h;
            } else ratio = w / h;
          }
          if (w / h > ratio) { bh = h; bw = Math.round(h * ratio); }
          else { bw = w; bh = Math.round(w / ratio); }
          bt = Math.round((h - bh) / 2);
          bl = Math.round((w - bw) / 2);
        }
        var player = document.querySelector('ruffle-player');
        if (player) {
          player.style.cssText = 'position:fixed;top:' + bt + 'px;left:' + bl + 'px;'
            + 'width:' + bw + 'px;height:' + bh + 'px;'
            + 'margin:0;padding:0;display:block;';
        }
        return m;
      } catch (e) {
        console.error('applyAspectRatioPlayer failed:', e);
        return null;
      }
    }

    var __currentAspectMode = 'fit';

    // 等 ruffle-player 加入 DOM 时,如果当前是非 fit 模式,自动应用
    function __observeRufflePlayerForAspect() {
      if (__currentAspectMode === 'fit') return;
      var existing = document.querySelector('ruffle-player');
      if (existing) {
        // 已有,等几帧让 Ruffle 内部 clientWidth 同步
        setTimeout(function () { applyAspectRatioPlayer(__currentAspectMode); }, 100);
        return;
      }
      var mo = new MutationObserver(function (mutations, observer) {
        var p = document.querySelector('ruffle-player');
        if (p) {
          observer.disconnect();
          // ruffle-player 加入但 WASM 还没初始化,等久点
          setTimeout(function () { applyAspectRatioPlayer(__currentAspectMode); }, 500);
        }
      });
      mo.observe(document.body || document.documentElement, {
        childList: true, subtree: true,
      });
      setTimeout(function () { try { mo.disconnect(); } catch(e){} }, 15000);
    }

    // 暴露给 Android 调用
    window.__applyAspectRatio = function (mode) {
      __currentAspectMode = mode || 'fit';
      __observeRufflePlayerForAspect();
      return applyAspectRatioPlayer(__currentAspectMode);
    };
    window.addEventListener('resize', function () {
      if (__currentAspectMode && __currentAspectMode !== 'fit') {
        applyAspectRatioPlayer(__currentAspectMode);
      }
    });
    // 首次进入:URL 带 ?ratio= 就应用(等 ruffle-player 出现)
    var __initialRatio = param('ratio', null);
    if (__initialRatio) {
      __currentAspectMode = __initialRatio;
      __observeRufflePlayerForAspect();
    }

    // 禁用长按选择 / 上下文菜单 / 缩放
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
