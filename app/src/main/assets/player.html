<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  #stage canvas, #stage ruffle-player {
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif !important;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>

  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');  // ruffle
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var ruffleUrl = CDN_URL || 'https://flash.local/ruffle/ruffle.js';
    var rufflePath = CDN_PATH || 'https://flash.local/ruffle/';

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      "letterbox": "fullscreen",
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      "scale": "showAll",
      "quality": "high",
      "allowFullscreen": false,
      "splashScreen": true,
      "preloader": true,
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    // CDN 模式下无本地字体文件，跳过
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [rufflePath + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        var opt = { url: SWF_URL, allowScriptAccess: true };
        if (BASE_URL) opt.base = BASE_URL;
        player.ruffle().load(opt);
        document.getElementById('loading').style.display = 'none';
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error(e);
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        var opt = { url: url, allowScriptAccess: true };
        if (base) opt.base = base;
        player.ruffle().load(opt);
      } catch(e) { console.error(e); }
    };

    // ===== 屏幕比例（aspect ratio）=====
    // mode: "fit" | "16:9" | "4:3" | "3:2" | "1:1" | "stretch"
    //
    // Ruffle 渲染原理（读 ruffle.js 源码确认）：
    //   - <ruffle-player> 是 web component,内部 shadow DOM
    //   - width/height 属性 → attributeChangedCallback → updateStyles →
    //     把 :host{width:..;height:..} 注入 shadow DOM,改 web component 自身尺寸
    //   - ruffle().config.scale 决定 SWF 怎么塞进 web component 视口：
    //       showAll  - 等比缩放,SWF 完整可见
    //       exactFit - 非等比拉伸,铺满
    //       noBorder - 等比缩放,裁掉超出部分
    //       noScale  - 原始尺寸,可能裁掉
    //   - ruffle().config.letterbox 决定黑边策略：
    //       on         - 显示黑条
    //       fullscreen - 在更大空间里显示(默认)
    //       off        - 不显示黑条
    //
    // 所以"屏幕比例"= 改 web component 的 width/height 属性 + 选 scale/letterbox。
    function parseAspectMode(mode) {
      // 返回 { kind: 'fit' | 'ratio' | 'stretch', ratio?: number }
      if (!mode || mode === 'fit') return { kind: 'fit' };
      if (mode === 'stretch') return { kind: 'stretch' };
      var parts = mode.split(':');
      if (parts.length !== 2) return { kind: 'fit' };
      var w = parseFloat(parts[0]);
      var h = parseFloat(parts[1]);
      if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) return { kind: 'fit' };
      return { kind: 'ratio', ratio: w / h };
    }

    function findRufflePlayer() {
      return document.querySelector('ruffle-player');
    }

    function getPlayerInstance() {
      var p = findRufflePlayer();
      if (!p || !p.ruffle) return null;
      try { return p.ruffle(); } catch (e) { return null; }
    }

    function applyAspectRatio(mode) {
      try {
        var m = parseAspectMode(mode);
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var player = findRufflePlayer();
        var inst = getPlayerInstance();

        if (m.kind === 'fit') {
          // fit: 让 ruffle-player 撑满视口,Ruffle 默认 showAll + letterbox:fullscreen
          if (player) {
            player.removeAttribute('width');
            player.removeAttribute('height');
            player.style.width = '100%';
            player.style.height = '100%';
            player.style.position = '';
            player.style.left = '';
            player.style.top = '';
          }
          stage.style.position = 'fixed';
          stage.style.inset = '0';
          stage.style.width = '100%';
          stage.style.height = '100%';
          if (inst && inst.config) {
            inst.config.scale = 'showAll';
            inst.config.letterbox = 'fullscreen';
          }
          return 'fit';
        }

        if (m.kind === 'stretch') {
          // stretch: 撑满视口,scale 改 exactFit,letterbox 关
          if (player) {
            player.removeAttribute('width');
            player.removeAttribute('height');
            player.style.width = '100%';
            player.style.height = '100%';
            player.style.position = '';
            player.style.left = '';
            player.style.top = '';
          }
          stage.style.position = 'fixed';
          stage.style.inset = '0';
          stage.style.width = '100%';
          stage.style.height = '100%';
          if (inst && inst.config) {
            inst.config.scale = 'exactFit';
            inst.config.letterbox = 'off';
          }
          return 'stretch';
        }

        // ratio 模式:16:9 / 4:3 / 3:2 / 1:1
        // 在视口内按 ratio contain 居中,把 ruffle-player 设成该尺寸
        var ratio = m.ratio;
        var boxRatio = vw / vh;
        var bw, bh;
        if (boxRatio > ratio) {
          bh = vh; bw = vh * ratio;
        } else {
          bw = vw; bh = vw / ratio;
        }
        // 关键:用属性(width/height)而不是 style,这样 Ruffle 的 updateStyles
        // 才会把它注入 :host 选择器,WASM 端 layout 才会按这个尺寸重算
        if (player) {
          player.setAttribute('width', Math.round(bw) + 'px');
          player.setAttribute('height', Math.round(bh) + 'px');
          player.style.position = 'absolute';
          player.style.left = ((vw - bw) / 2) + 'px';
          player.style.top = ((vh - bh) / 2) + 'px';
        }
        stage.style.position = 'fixed';
        stage.style.inset = '0';
        stage.style.width = bw + 'px';
        stage.style.height = bh + 'px';
        stage.style.left = ((vw - bw) / 2) + 'px';
        stage.style.top = ((vh - bh) / 2) + 'px';
        if (inst && inst.config) {
          inst.config.scale = 'showAll';
          inst.config.letterbox = 'on';
        }
        return mode;
      } catch (e) {
        console.error('applyAspectRatio failed:', e);
        return null;
      }
    }

    // 窗口尺寸变化（旋转/全屏/分屏）时重应用当前比例
    var __currentAspectMode = 'fit';
    window.addEventListener('resize', function () {
      if (__currentAspectMode && __currentAspectMode !== 'fit') {
        applyAspectRatio(__currentAspectMode);
      }
    });
    // 暴露给 Android 调用
    window.__applyAspectRatio = function (mode) {
      __currentAspectMode = mode || 'fit';
      return applyAspectRatio(__currentAspectMode);
    };
    // 首次进入即应用（URL 里可带 ?ratio=16:9 便于调试）
    var __initialRatio = param('ratio', null);
    if (__initialRatio) {
      __currentAspectMode = __initialRatio;
      // 延迟到 ruffle-player 创建后再应用
      setTimeout(function () { applyAspectRatio(__currentAspectMode); }, 50);
    }

    // 禁用长按选择 / 上下文菜单 / 缩放
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
