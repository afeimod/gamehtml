<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlashBox Player</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,"Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#A0A0B5;background:#12121A;z-index:50;}
  #splash .logo{width:64px;height:64px;border-radius:16px;
    background:linear-gradient(135deg,#6C5CE7,#00CEC9);display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:bold;font-size:24px;box-shadow:0 8px 24px rgba(108,92,231,.5);}
  #splash .txt{margin-top:16px;font-size:14px;}
  #splash .bar{margin-top:12px;width:120px;height:4px;border-radius:2px;background:#2A2A38;overflow:hidden;}
  #splash .bar i{display:block;height:100%;width:40%;background:#00CEC9;animation:load 1.1s infinite;}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    color:#FD79A8;background:#12121A;z-index:60;padding:24px;text-align:center;}
  #err h3{color:#F5F5FA;margin:0 0 8px;}
  #err p{color:#A0A0B5;font-size:13px;max-width:320px;}
  ruffle-player,canvas{outline:none;}
</style>
</head>
<body>
<div id="stage"><div id="container"></div></div>

<div id="splash">
  <div class="logo">F</div>
  <div class="txt" id="splash_txt">正在加载…</div>
  <div class="bar"><i></i></div>
</div>

<div id="err">
  <h3 id="err_title">播放失败</h3>
  <p id="err_msg"></p>
</div>

<script>
// ---- parse params ----
(function(){
  var qs = new URLSearchParams(location.search);
  var ENGINE = qs.get('engine') || 'ruffle';
  var SWF = qs.get('swf') || '';
  var NAME = qs.get('name') || 'movie.swf';
  // FIX: URLSearchParams.get() already decodes URL encoding once.
  // Do NOT call decodeURIComponent again - it causes double-decoding errors.
  var rawCfg = qs.get('config');
  var CFG = {};
  if (rawCfg) {
    try { CFG = JSON.parse(rawCfg); } catch(e) {
      try { CFG = JSON.parse(decodeURIComponent(rawCfg)); } catch(e2) { CFG = {}; }
    }
  }
  var BASE = location.href.substring(0, location.href.lastIndexOf('/')+1);

  window.FlashBox = { engine: ENGINE, swf: SWF, name: NAME, config: CFG };

  function setSplash(t){ document.getElementById('splash_txt').textContent = t; }
  function showError(title, msg){
    document.getElementById('err_title').textContent = title || '播放失败';
    document.getElementById('err_msg').textContent = msg || '';
    document.getElementById('err').style.display = 'flex';
    document.getElementById('splash').style.display = 'none';
  }
  function hideSplash(){ document.getElementById('splash').style.display = 'none'; }

  function reportTitle(){
    try{ AndroidBridge.reportTitle(NAME + ' - ' + ENGINE); }catch(e){}
  }

  // quality map for ruffle
  function ruffleQuality(q){ return (q==='auto'||!q) ? null : q; }
  function ruffleScale(s){ return s || 'showAll'; }
  function ruffleLetterbox(b){ return b ? 'on' : 'off'; }
  function ruffleRenderer(r){ return (r==='auto'||!r) ? null : r; }

  // ============ Ruffle ============
  function loadRuffle(){
    setSplash('加载 Ruffle 引擎…');
    var s = document.createElement('script');
    s.src = BASE + 'engines/ruffle/ruffle.js';
    s.onload = function(){
      setSplash('初始化播放器…');
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        allowScriptAccess: true,
        autoplay: 'on',
        backgroundColor: null,
        letterbox: ruffleLetterbox(CFG.letterbox),
        unmuteOverlay: 'visible',
        upgradeToHttps: true,
        compatibilityRules: true,
        warnOnUnsupportedContent: false,
        showSwfDownload: false,
        contextMenu: 'on',
        splashScreen: false,
        preloader: true,
        maxExecutionDuration: { secs: 600, nanos: 0 },
        menu: true,
        quality: ruffleQuality(CFG.quality),
        scale: ruffleScale(CFG.scale),
        forceScale: false,
        allowFullscreen: true,
        wmode: 'opaque',
        preferredRenderer: ruffleRenderer(CFG.renderer),
        polyfills: false,
        openUrlMode: 'allow',
        allowNetworking: 'all',
        backgroundExecutionMode: 'mainThread',
        publicPath: BASE + 'engines/ruffle/'
      };
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        var container = document.getElementById('container');
        container.innerHTML = '';
        container.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.addEventListener('loadedmetadata', function(){ hideSplash(); reportTitle(); try{AndroidBridge.ready();}catch(e){} });
        player.addEventListener('error', function(e){ showError('Ruffle 播放出错', (e&&e.detail&&e.detail.message)||'请尝试切换 Waflash 引擎'); });
        player.ruffle().load(SWF, NAME);
        setTimeout(hideSplash, 4000);
      } catch(e){
        showError('Ruffle 初始化失败', String(e));
      }
    };
    s.onerror = function(){
      showError('引擎加载失败', 'Ruffle 资源缺失，正在尝试 Waflash…');
      // Auto-fallback to Waflash if Ruffle fails
      ENGINE = 'waflash';
      setTimeout(loadWaflash, 500);
    };
    document.head.appendChild(s);
  }

  // ============ Waflash ============
  function loadWaflash(){
    setSplash('加载 Waflash 引擎…');
    var dim = aspectDimensions(CFG.scale);
    window.GAME = {
      name: NAME.replace(/\.swf$/i,''),
      slug: NAME,
      src: SWF,
      width: dim.w,
      height: dim.h,
      extension: 'SWF',
      paramOptionsCode: '<param name="wmode" value="opaque"/><param name="allowNetworking" value="internal"/><param name="allowScriptAccess" value="No"/>',
      embedOptionsCode: ' wmode="opaque" allowNetworking="internal" allowScriptAccess="No"',
      image: '',
      playable: 1,
      resizable: 1,
      updatedAt: '',
      avm: '2',
      reqEmulator: 'waflash',
      fileType: 1
    };
    window.wafOptions = {
      enableFilters: CFG.smooth !== false,
      quality: CFG.quality || 'high'
    };

    // Build the waflash DOM container
    var container = document.getElementById('container');
    container.innerHTML =
      '<link rel="stylesheet" href="' + BASE + 'engines/waflash/waflash-style.css"/>' +
      '<div id="waflashContainer" style="width:100%;height:100%;">' +
      '<canvas class="waflashCanvas" id="canvas" tabindex="1" style="width:100%;height:100%;"></canvas>' +
      '<div id="waflashStatus" style="display:none;">Playing...</div>' +
      '</div>';

    // style link for waflash
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = BASE + 'css/embed.css';
    document.head.appendChild(css);

    // Load waflash loader (non-module script)
    var loader = document.createElement('script');
    loader.src = BASE + 'engines/waflash/waflash.js';
    loader.onload = function(){
      setSplash('启动 Waflash…');
    };
    loader.onerror = function(){
      showError('引擎加载失败', 'Waflash 资源缺失，正在尝试 Ruffle…');
      // Auto-fallback to Ruffle if Waflash fails
      ENGINE = 'ruffle';
      setTimeout(loadRuffle, 500);
    };
    document.head.appendChild(loader);

    // FIX: Load waflash-player.min.js as a regular script instead of ES module
    // ES module import from file:// has CORS issues on Android WebView
    var playerScript = document.createElement('script');
    playerScript.src = BASE + 'engines/waflash/waflash-player.min.js';
    playerScript.onload = function(){
      setSplash('初始化 Waflash 播放器…');
      try {
        if (typeof createWaflash === 'function') {
          createWaflash(window.GAME.src, window.wafOptions || {});
          setTimeout(function(){ hideSplash(); }, 2500);
          try{AndroidBridge.ready();}catch(e){}
        } else if (typeof window.createWaflash === 'function') {
          window.createWaflash(window.GAME.src, window.wafOptions || {});
          setTimeout(function(){ hideSplash(); }, 2500);
          try{AndroidBridge.ready();}catch(e){}
        } else {
          // waflash-player.min.js might export via ES module; try dynamic import as fallback
          try {
            var modScript = document.createElement('script');
            modScript.type = 'module';
            modScript.textContent =
              'import { createWaflash } from "' + BASE + 'engines/waflash/waflash-player.min.js";\n' +
              'window.createWaflash = createWaflash;\n' +
              'try { createWaflash(window.GAME.src, window.wafOptions || {}); \n' +
              '  setTimeout(function(){ document.getElementById("splash").style.display="none"; }, 2500);\n' +
              '  try{AndroidBridge.ready();}catch(e){} \n' +
              '} catch(e){ console.error(e); ' +
              '  document.getElementById("err_title").textContent="Waflash 播放出错";' +
              '  document.getElementById("err_msg").textContent=String(e);' +
              '  document.getElementById("err").style.display="flex";' +
              '  document.getElementById("splash").style.display="none";' +
              '}';
            document.head.appendChild(modScript);
          } catch(e2) {
            showError('Waflash 初始化失败', String(e2));
          }
        }
      } catch(e) {
        showError('Waflash 初始化失败', String(e));
      }
    };
    playerScript.onerror = function(){
      // Fallback to ES module import
      try {
        var modScript = document.createElement('script');
        modScript.type = 'module';
        modScript.textContent =
          'import { createWaflash } from "' + BASE + 'engines/waflash/waflash-player.min.js";\n' +
          'window.createWaflash = createWaflash;\n' +
          'try { createWaflash(window.GAME.src, window.wafOptions || {}); \n' +
          '  setTimeout(function(){ document.getElementById("splash").style.display="none"; }, 2500);\n' +
          '  try{AndroidBridge.ready();}catch(e){} \n' +
          '} catch(e){ console.error(e); }';
        document.head.appendChild(modScript);
      } catch(e) {
        showError('引擎加载失败', 'Waflash player 加载失败，请使用 Ruffle。');
      }
    };
    document.head.appendChild(playerScript);

    reportTitle();
  }

  function aspectDimensions(scale){
    // pick a sensible stage size; waflash scales canvas to container
    return { w: 800, h: 600 };
  }

  // ---- dispatch ----
  if (ENGINE === 'waflash') loadWaflash();
  else loadRuffle();

  // keep canvas focused for key events
  document.addEventListener('click', function(){
    var c = document.getElementById('canvas');
    if (c && c.focus) c.focus();
    var r = document.querySelector('ruffle-player');
    if (r && r.focus) r.focus();
  });

  // suppress default touch scrolling on the stage
  document.addEventListener('touchmove', function(e){
    if (e.touches.length === 1) e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
