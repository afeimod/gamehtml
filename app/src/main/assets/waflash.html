<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>WAFlash 播放器</title>
<link rel="stylesheet" href="https://flash.local/waflash/waflash-style.css" />
<style>
  /* 中文字体：WAFlash 通过浏览器 @font-face 加载字体供文本渲染使用
     覆盖常见中文字体名称，全部指向 simhei.ttf，确保中文正常显示 */
  @font-face { font-family: "SimHei"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "Microsoft YaHei"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "SimSun"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "\u9ed1\u4f53"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "\u5b8b\u4f53"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "\u5fae\u8f6f\u96c5\u9ed1"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "SimHei", "Microsoft YaHei", "SimSun", "Noto Sans CJK SC",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  canvas {
    width: 100%; height: 100%; display: block; outline: none;
    touch-action: none;
    font-family: "SimHei", "Microsoft YaHei", "SimSun", "Noto Sans CJK SC",
                 Arial, Helvetica, sans-serif !important;
  }
  #waflashStatus {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #beb5f9; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 16px; text-align: center; z-index: 10;
    pointer-events: none; /* 不拦截点击 */
  }
  #hint {
    position: fixed; bottom: 4px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.3); font-size: 10px; z-index: 10;
    pointer-events: none; /* 不拦截点击 */
  }
</style>
</head>
<body>
  <div id="waflashContainer">
    <canvas class="waflashCanvas" id="canvas" tabindex="1"></canvas>
    <div id="waflashStatus">Loading...</div>
    <div id="hint">WAFlash · AS2/AS3</div>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var SWF_URL = params.get('swf') || '';
    var BASE_URL = params.get('base') || '';
    var TITLE = params.get('title') || 'Flash 游戏';
    document.title = TITLE;

    var statusEl = document.getElementById('waflashStatus');
    var canvas = document.getElementById('canvas');

    // === 高分辨率渲染修复 ===
    // 问题：WAFlash 的 WASM 模块将 canvas 像素尺寸设为 SWF 舞台尺寸（如 550×400），
    //       CSS 将其拉伸到全屏。在高 DPI 手机屏幕上（devicePixelRatio=2/3），
    //       每个 Flash 像素被放大 2~3 倍，导致画面模糊。
    //
    // 方案：在 WAFlash 引擎加载前，拦截 canvas.width/height 赋值和 WebGL viewport 调用，
    //       将实际渲染分辨率乘以 devicePixelRatio。
    //       这与 WAFlash 官方全屏代码（canvasResolutionScaleMode==2）的做法完全一致。
    //
    // 原理：
    //   - WAFlash 设置 canvas.width = 550 → 实际 canvas.width = 550 × dpr = 1650
    //   - WAFlash 调用 gl.viewport(0,0,550,400) → 实际 viewport = (0,0,1650,1200)
    //   - WAFlash 读取 canvas.width → 返回逻辑值 550（不影响内部坐标计算）
    //   - WASM 通过 sa() 读取 devicePixelRatio → 返回 1（防止双重缩放）
    (function setupHiDPICanvas() {
      var actualDpr = window.devicePixelRatio || 1;
      if (actualDpr <= 1) return; // 标准 DPI 屏幕无需处理

      console.log('[WAF] HiDPI 修复: dpr=' + actualDpr);

      // 1. 覆盖 devicePixelRatio 为 1，防止 WASM 代码通过 sa() 自行缩放导致双重放大
      try {
        Object.defineProperty(window, 'devicePixelRatio', {
          get: function() { return 1; },
          configurable: true
        });
      } catch(e) {
        console.warn('[WAF] 无法覆盖 devicePixelRatio', e);
      }

      // 2. 拦截 canvas.width / canvas.height
      //    setter：将逻辑值乘以 dpr 后设置到实际 canvas
      //    getter：返回逻辑值（WAFlash 内部坐标计算依赖此值）
      var widthDesc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
      var heightDesc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
      var _logicalW = canvas.width || 0;
      var _logicalH = canvas.height || 0;

      Object.defineProperty(canvas, 'width', {
        get: function() { return _logicalW; },
        set: function(v) {
          _logicalW = v;
          widthDesc.set.call(this, Math.round(v * actualDpr));
        },
        configurable: true
      });
      Object.defineProperty(canvas, 'height', {
        get: function() { return _logicalH; },
        set: function(v) {
          _logicalH = v;
          heightDesc.set.call(this, Math.round(v * actualDpr));
        },
        configurable: true
      });

      // 3. 拦截 WebGL 上下文创建，patch viewport 和 getParameter
      var origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, attrs) {
        var ctx = origGetContext.call(this, type, attrs);
        if (ctx && !ctx.__wafDprPatched &&
            (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
          ctx.__wafDprPatched = true;

          // patch viewport：将 WAFlash 传入的逻辑尺寸乘以 dpr
          var origViewport = ctx.viewport.bind(ctx);
          ctx.viewport = function(x, y, w, h) {
            origViewport(x, y, Math.round(w * actualDpr), Math.round(h * actualDpr));
          };

          // patch getParameter：GL_VIEWPORT (2978) 返回逻辑值，防止 WASM 读到缩放后的尺寸
          var origGetParameter = ctx.getParameter.bind(ctx);
          ctx.getParameter = function(pname) {
            var val = origGetParameter(pname);
            if (pname === 2978 && val && val.length === 4) {
              // 返回逻辑 viewport 尺寸
              return new Int32Array([
                val[0], val[1],
                Math.round(val[2] / actualDpr),
                Math.round(val[3] / actualDpr)
              ]);
            }
            return val;
          };

          console.log('[WAF] WebGL context 已 patch (dpr=' + actualDpr + ')');
        }
        return ctx;
      };
    })();

    // === Canvas 交互处理（来自 WAFlash 官方源码） ===
    // 1. 点击 canvas 获取焦点（键盘输入需要）
    canvas.addEventListener('click', function() { canvas.focus(); });

    // 2. 阻止 canvas 上的默认键盘行为（仅阻止滚动相关按键）
    //    注意：不再 stopPropagation，否则 WAFlash 引擎的 window 级监听器收不到事件
    var scrollKeys = { 32: 1, 33: 1, 34: 1, 35: 1, 36: 1, 37: 1, 38: 1, 39: 1, 40: 1 };
    canvas.addEventListener('keydown', function(ev) {
      if (scrollKeys[ev.keyCode]) ev.preventDefault();
      // 不调用 stopPropagation，让事件冒泡到 window/document 供 WAFlash 引擎接收
    });
    canvas.addEventListener('keyup', function(ev) {
      if (scrollKeys[ev.keyCode]) ev.preventDefault();
    });

    // 3. mousedown 焦点管理：点击 canvas 获取焦点，点击其他区域失去焦点
    (function() {
      var focused = false;
      document.addEventListener('mousedown', function(ev) {
        if (ev.target == canvas) {
          if (!focused) {
            canvas.focus();
            focused = true;
          }
        } else {
          focused = false;
        }
        return true;
      });
      // touchstart 也要确保 canvas 获取焦点（移动端）
      document.addEventListener('touchstart', function(ev) {
        if (ev.target == canvas) {
          try { canvas.focus(); } catch(e) {}
        }
      }, { passive: true });
    })();

    // 4. 自动恢复焦点：定期检查并确保 canvas 有焦点（虚拟手柄操作时可能失焦）
    setInterval(function() {
      if (document.activeElement !== canvas && document.activeElement !== document.body) {
        // 如果焦点不在 canvas 也不在 body，尝试恢复
        try { canvas.focus(); } catch(e) {}
      }
    }, 1000);

    // 4. 移动端滚动适配
    var is_mobile = /Mobi/i.test(window.navigator.userAgent);
    if (is_mobile) {
      function scrollToSubject() {
        try {
          window.scrollTo({ top: 100, left: 0, behavior: 'smooth' });
        } catch(e) {}
      }
      scrollToSubject();
      window.addEventListener('orientationchange', function() {
        setTimeout(scrollToSubject, 100);
      });
    } else {
      canvas.focus();
    }

    // 判断是否为本地文件代理 URL（flash.local/local.swf），处理可能的时间戳参数
    var isLocalFile = SWF_URL.split('?')[0] === 'https://flash.local/local.swf';

    if (!SWF_URL) {
      statusEl.textContent = '错误: 未指定 SWF URL';
    } else {
      statusEl.textContent = '正在加载引擎...';
    }

    // 设置 <base> 标签：SWF 内部相对路径以原始页面 URL 为 base
    if (BASE_URL) {
      try {
        var baseObj = new URL(BASE_URL);
        var baseTag = document.createElement('base');
        baseTag.href = baseObj.origin + baseObj.pathname.substring(0, baseObj.pathname.lastIndexOf('/') + 1);
        document.head.appendChild(baseTag);
        console.log('[WAF] base href: ' + baseTag.href);
      } catch(e) {}
    }

    console.log('[WAF] SWF_URL: ' + SWF_URL);
    console.log('[WAF] isLocalFile: ' + isLocalFile);

    // 加载 WAFlash 引擎
    function loadEngine(swfUrlToLoad) {
      import('https://flash.local/waflash/waflash-player.min.js').then(function(module) {
        console.log('[WAF] 引擎加载完成');
        statusEl.textContent = '正在加载 SWF...';

        var fn = (module && module.createWaflash) || window.createWaflash;
        if (!fn) {
          console.log('[WAF] createWaflash 未导出，可能已自动启动');
          setTimeout(function() { statusEl.style.display = 'none'; }, 3000);
          return;
        }

        try {
          fn(swfUrlToLoad, { gpu: true });
          console.log('[WAF] createWaflash 已调用: ' + swfUrlToLoad);
          setTimeout(function() { statusEl.style.display = 'none'; }, 3000);
        } catch(e) {
          statusEl.textContent = '加载失败: ' + e.message;
          console.error('[WAF] ' + e.message);
        }
      }).catch(function(err) {
        statusEl.textContent = '引擎加载失败: ' + (err.message || err);
        console.error('[WAF] 引擎: ' + (err.message || err));
      });
    }

    if (isLocalFile) {
      // 本地文件：SWF_URL 已被替换为 https://flash.local/local.swf
      // shouldInterceptRequest 会拦截此 URL 并读取真实文件
      // 直接传给 WAFlash 即可（WAFlash 的 fetch 能拦截 flash.local 的 HTTP 请求）
      console.log('[WAF] 本地文件模式：虚拟 URL 代理');
      loadEngine(SWF_URL);
    } else {
      // 远程 SWF：直接传 URL 给 WAFlash
      loadEngine(SWF_URL);
    }

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });

    // WebGL 上下文丢失处理
    canvas.addEventListener('webglcontextlost', function(e) {
      console.warn('[WAF] WebGL context lost');
      e.preventDefault();
      statusEl.style.display = 'block';
      statusEl.textContent = 'WebGL 上下文丢失，请刷新页面';
    }, false);
  </script>
</body>
</html>
