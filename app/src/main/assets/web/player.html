<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>播放器</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage.fill ruffle-player,#stage.fill #canvas,#stage.fill #waflashContainer{width:100%!important;height:100%!important}
  #stage ruffle-player{width:100%;height:100%;background:#000}
  #stage #canvas{display:block;background:#000}
  /* Waflash container */
  #waflashContainer{position:relative;width:100%;height:100%;background:#000}
  #waflashStatus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#9AA4B2;font-size:14px;text-align:center;z-index:5;display:none}
  /* Player toolbar */
  #pbar{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:50;
    display:flex;gap:6px;align-items:center;padding:4px 8px;opacity:.92}
  #pbar button{background:rgba(20,24,30,.85);border:1px solid #262C36;color:#ECEFF4;border-radius:8px;
    padding:6px 10px;font-size:13px}
  #pbar .sp{flex:1}
  #engTag{background:rgba(255,138,0,.9);color:#fff;border:0;font-size:12px;padding:4px 8px;border-radius:6px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#9AA4B2;font-size:14px;background:#000;z-index:40}
  .spin{width:38px;height:38px;border:3px solid #262C36;border-top-color:#FF8A00;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    color:#ECEFF4;background:#000;z-index:60;text-align:center;padding:20px}
  #err button{margin:8px;padding:10px 18px;border:0;border-radius:10px;background:#FF8A00;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <!-- Waflash needs a #canvas and #waflashStatus element -->
  <div id="waflashContainer" style="display:none">
    <div id="waflashStatus"></div>
    <canvas id="canvas" tabindex="1"></canvas>
  </div>
</div>
<div id="pbar">
  <button id="bHome">⌂ 首页</button>
  <button id="bBack">‹ 后退</button>
  <button id="bFav">★ 收藏</button>
  <span class="sp"></span>
  <button id="bCtrl">⊞ 按键</button>
  <span id="engTag">引擎</span>
</div>
<div id="loading"><div style="text-align:center"><div class="spin"></div><div id="loadTxt">加载中…</div></div></div>
<div id="err"><h2 style="color:#FF8A00">无法播放</h2><p id="errMsg" style="color:#9AA4B2"></p>
  <button onclick="location.href='https://app.local/index.html'">返回首页</button>
  <button onclick="location.reload()">重试</button></div>
<script src="controls.js"></script>
<script src="player.js"></script>
</body>
</html>
