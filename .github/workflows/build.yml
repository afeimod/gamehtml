name: Android Build

# 手动触发：Actions -> Android Build -> Run workflow
# 不用 android-actions/setup-android（最近 license 自动接受会卡住），改成纯 bash 步骤安装 SDK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug | release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi:
        description: 'ABI to package (armeabi-v7a, arm64-v8a, x86, x86_64, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
      minify:
        description: 'Enable R8 minify (release only)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 纯 bash 装 Android SDK（避开 android-actions/setup-android 当前的 license bug）
      - name: Install Android SDK (pure bash)
        run: |
          set -e
          SDK="${{ env.ANDROID_HOME }}"
          echo "Installing Android SDK to $SDK"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          # 下载 cmdline-tools 16.0 (12266719)
          echo "Downloading commandlinetools-linux-12266719_latest.zip ..."
          curl -sSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
          unzip -q -o cmdline-tools.zip -d /tmp/clt
          # 目录结构必须是 cmdline-tools/latest/
          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"
          mv /tmp/clt/cmdline-tools/* "$SDK/cmdline-tools/latest/"
          rm -rf /tmp/clt cmdline-tools.zip
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "sdkmanager: $(which sdkmanager)"
          sdkmanager --version

          # 接受所有 license（多次执行确保新装的 package license 也被接受）
          echo "Accepting licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "Licenses done."

          # 安装需要的组件
          echo "Installing platforms;android-34, build-tools;34.0.0, platform-tools..."
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "Installation complete."

          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/local.properties"
          cat "$GITHUB_WORKSPACE/local.properties"
          ls -la "$SDK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"
        run: |
          set -e
          ABI_FILTER="${{ inputs.abi }}"
          BUILD_TYPE="${{ inputs.build_type }}"
          MINIFY="${{ inputs.minify }}"
          echo "Build type: $BUILD_TYPE  ABI: $ABI_FILTER  minify=$MINIFY"
          case "$ABI_FILTER" in
            arm64-v8a) ABILIST="arm64-v8a" ;;
            armeabi-v7a) ABILIST="armeabi-v7a" ;;
            x86) ABILIST="x86" ;;
            x86_64) ABILIST="x86_64" ;;
            *) ABILIST="arm64-v8a,armeabi-v7a,x86,x86_64" ;;
          esac
          if [ "$BUILD_TYPE" = "release" ] && [ "$MINIFY" = "true" ]; then
            sed -i 's|minifyEnabled false|minifyEnabled true|' app/build.gradle
          fi
          CAP_BUILD_TYPE="$(echo "$BUILD_TYPE" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          gradle ":app:assemble${CAP_BUILD_TYPE}" \
            -PabiList="$ABILIST" \
            --no-daemon --stacktrace
        shell: bash

      - name: Locate APK
        id: locate
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          APK_PATH=$(ls app/build/outputs/apk/$BUILD_TYPE/*.apk | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"
          ls -la "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game4399FlashBox-${{ inputs.build_type }}-${{ inputs.abi }}
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to release (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.apk_path }}
          fail_on_unmatched_files: true
