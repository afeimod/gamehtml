name: Build Android Release APK

# Manual build - run via the GitHub Actions UI (workflow_dispatch)
# Optional inputs let you sign the release with your own keystore
# (pass the secrets + the keystore_base64 input on dispatch).

on:
  workflow_dispatch:
    inputs:
      keystore_base64:
        description: 'Base64-encoded release keystore (.jks / .keystore). Leave empty to build an UNSIGNED release APK using the debug key.'
        required: false
        default: ''
      keystore_alias:
        description: 'Keystore alias (only used when keystore is provided).'
        required: false
        default: 'flashbox'
      keystore_password:
        description: 'Keystore password (only used when keystore is provided).'
        required: false
        default: ''
      key_password:
        description: 'Key password (only used when keystore is provided).'
        required: false
        default: ''
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - signedRelease
      app_version:
        description: 'Override versionName (e.g. 1.0.0). Leave empty to use build.gradle default.'
        required: false
        default: ''
      app_version_code:
        description: 'Override versionCode (integer). Leave empty to use build.gradle default.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # gradle/actions/setup-gradle 自动处理 wrapper distribution 下载 + 缓存
      # （不依赖 gradlew 本地 jar）
      - name: 🛠️ Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🛠️ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/jdks
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.kt', '**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🛡️ Verify gradle-wrapper.jar is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "❌ gradle-wrapper.jar is missing - it should be committed to the repo"
            echo "    Run on your local machine: gradle wrapper --gradle-version 8.5"
            echo "    Or download from: https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
            exit 1
          fi
          ls -la gradle/wrapper/

      - name: 📦 Decode keystore (if provided)
        id: keystore
        if: ${{ inputs.keystore_base64 != '' }}
        run: |
          echo "${{ inputs.keystore_base64 }}" | base64 -d > app/flashbox-release.jks
          ls -la app/flashbox-release.jks
          echo "KEYSTORE_FILE=$(pwd)/app/flashbox-release.jks" >> $GITHUB_OUTPUT

      - name: 🔨 Build APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
          KEY_ALIAS: ${{ inputs.keystore_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}
          FLASHBOX_VERSION: ${{ inputs.app_version }}
          FLASHBOX_VERSION_CODE: ${{ inputs.app_version_code }}
        run: |
          set -e
          chmod +x gradlew

          # Optional: override app version from workflow input
          if [ -n "$FLASHBOX_VERSION" ]; then
            echo "Overriding versionName to $FLASHBOX_VERSION"
            sed -i.bak "s/versionName \"[0-9.]*\"/versionName \"$FLASHBOX_VERSION\"/" app/build.gradle
          fi
          if [ -n "$FLASHBOX_VERSION_CODE" ]; then
            echo "Overriding versionCode to $FLASHBOX_VERSION_CODE"
            sed -i.bak "s/versionCode [0-9]*/versionCode $FLASHBOX_VERSION_CODE/" app/build.gradle
          fi

          case "${{ inputs.build_type }}" in
            signedRelease)
              if [ -z "$KEYSTORE_FILE" ] || [ ! -f "app/flashbox-release.jks" ]; then
                echo "❌ signedRelease requires a keystore. Provide keystore_base64 input."
                exit 1
              fi
              ./gradlew assembleRelease \
                -Pandroid.injected.signing.store.file=$(pwd)/app/flashbox-release.jks \
                -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                -Pandroid.injected.signing.key.password=$KEY_PASSWORD
              ;;
            release)
              ./gradlew assembleRelease
              ;;
            debug)
              ./gradlew assembleDebug
              ;;
            *)
              echo "❌ Unknown build_type: ${{ inputs.build_type }}"; exit 1;;
          esac

      - name: 📂 Locate APK
        id: locate
        run: |
          set -e
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/FlashGameBox-release.apk
            APK=out/FlashGameBox-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/FlashGameBox-release-unsigned.apk
            APK=out/FlashGameBox-release-unsigned.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk out/FlashGameBox-debug.apk
            APK=out/FlashGameBox-debug.apk
          else
            echo "❌ No APK found"; exit 1
          fi
          echo "APK=$APK" >> $GITHUB_OUTPUT
          ls -la out/

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashbox-apk-${{ inputs.build_type }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🔖 Get APK info
        id: info
        run: |
          APK_FILE=$(ls out/*.apk | head -n 1)
          SIZE=$(stat -c %s "$APK_FILE")
          SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "apk=$APK_FILE" >> $GITHUB_OUTPUT
          echo "## 📦 Flash Game Box APK" >> $GITHUB_STEP_SUMMARY
          echo "- File: \`$APK_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $((SIZE / 1024)) KB" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256: \`$SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- Build type: ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY

      - name: 🗑️ Clean up keystore
        if: always()
        run: rm -f app/flashbox-release.jks
