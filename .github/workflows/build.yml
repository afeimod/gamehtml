name: Android Build

# 手动触发：Actions -> Android Build -> Run workflow
# 支持两种构建：debug / release（release 跟 debug 一样用 debug 签名，避免密钥管理麻烦；如需正式签名请自配）
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug | release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi:
        description: 'ABI to package (armeabi-v7a, arm64-v8a, x86, x86_64, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
      minify:
        description: 'Enable R8 minify (release only)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # android-actions/setup-android 偶尔会卡在 license 接受 (cmdline-tools 版本不一致)
      # 显式指定 cmdline-tools-version 与 GitHub Runner 预装一致
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept all SDK licenses (safety net)
        env:
          # 让 sdkmanager 不走交互
          JAVA_TOOL_OPTIONS: ""
        run: |
          set -e
          # 找到最新的 cmdline-tools
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools/12.0/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          else
            SDKMANAGER="$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          # 多次执行以确保所有 license 被接受
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          echo "Licenses accepted"

      - name: Create local.properties
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "ERROR: ANDROID_HOME / ANDROID_SDK_ROOT not set"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "---"
          cat local.properties

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"
        run: |
          set -e
          ABI_FILTER="${{ inputs.abi }}"
          BUILD_TYPE="${{ inputs.build_type }}"
          MINIFY="${{ inputs.minify }}"
          echo "Build type: $BUILD_TYPE  ABI: $ABI_FILTER  minify=$MINIFY"
          case "$ABI_FILTER" in
            arm64-v8a) ABILIST="arm64-v8a" ;;
            armeabi-v7a) ABILIST="armeabi-v7a" ;;
            x86) ABILIST="x86" ;;
            x86_64) ABILIST="x86_64" ;;
            *) ABILIST="arm64-v8a,armeabi-v7a,x86,x86_64" ;;
          esac
          if [ "$BUILD_TYPE" = "release" ] && [ "$MINIFY" = "true" ]; then
            sed -i 's|minifyEnabled false|minifyEnabled true|' app/build.gradle
          fi
          CAP_BUILD_TYPE="$(echo "$BUILD_TYPE" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          gradle ":app:assemble${CAP_BUILD_TYPE}" \
            -PabiList="$ABILIST" \
            --no-daemon --stacktrace
        shell: bash

      - name: Locate APK
        id: locate
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          APK_PATH=$(ls app/build/outputs/apk/$BUILD_TYPE/*.apk | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"
          ls -la "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game4399FlashBox-${{ inputs.build_type }}-${{ inputs.abi }}
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to release (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.apk_path }}
          fail_on_unmatched_files: true
