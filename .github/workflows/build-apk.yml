# ── FlashGameBox · 手动构建 APK ──────────────────────────────
# 在 GitHub 仓库的 Actions 页面选择 "Build APK" 工作流，
# 点击 "Run workflow" 即可手动触发构建。
# 构建完成后在 Artifacts 区域下载 debug / release APK。
# 引擎资源（Ruffle/Waflash）离线内置在 assets 中；
# 如果 Ruffle 不存在，构建前会自动下载。
name: Build APK

on:
  workflow_dispatch:        # 手动触发
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: 📦 Prepare engine assets (Ruffle offline)
        run: |
          if [ ! -f app/src/main/assets/web/engines/ruffle/ruffle.js ]; then
            echo "Ruffle not in assets, downloading..."
            bash scripts/download-ruffle.sh
          else
            echo "Ruffle already in assets (offline), skip download."
          fi
          echo "Engine assets:"
          ls -lh app/src/main/assets/web/engines/waflash/ | head -5
          ls -lh app/src/main/assets/web/engines/ruffle/ | head -5

      - name: 📦 Download Gradle Wrapper JAR (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, downloading..."
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.7/gradle/wrapper/gradle-wrapper.jar"
            echo "Downloaded gradle-wrapper.jar ($(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes)"
          else
            echo "gradle-wrapper.jar already present"
          fi

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 💾 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🔨 Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔨 Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: FlashGameBox-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: FlashGameBox-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ github.event.inputs.build_type || 'both' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Engine Assets**: Offline in assets/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls app/build/outputs/apk/**/*.apk 2>/dev/null; then
            echo "### Generated APKs" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -name "*.apk" -exec sh -c 'echo "- $(basename {}): $(du -h {} | cut -f1)"' \; >> $GITHUB_STEP_SUMMARY
          else
            echo "### No APKs generated" >> $GITHUB_STEP_SUMMARY
          fi
