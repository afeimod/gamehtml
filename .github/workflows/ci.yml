name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-ci-gradle-${{ hashFiles('**/*.gradle*') }}
      - name: Check Java syntax
        run: |
          find app/src/main/java -name "*.java" -print0 | xargs -0 -I{} javac -version 2>&1 | head -1
          echo "Files:"
          find app/src/main/java -name "*.java" | wc -l
      - name: Check web assets
        run: |
          echo "=== HTML files ==="
          find app/src/main/assets/www -name "*.html" -exec echo "  {}" \;
          echo "=== JS files ==="
          find app/src/main/assets/www -name "*.js" -exec echo "  {}" \;
          echo "=== Engines ==="
          ls -la app/src/main/assets/www/engines/
      - name: Basic syntax check on JS
        run: |
          for f in $(find app/src/main/assets/www -name "*.js"); do
            node -c "$f" 2>&1 | head -5 || echo "WARN: $f has issues"
          done

  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-ci-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
