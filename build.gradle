// Top-level build file
//
// Modern AGP 8 / Gradle 8 layout:
//   * `repositories` for APPLICATION dependencies live in `settings.gradle`
//     under `dependencyResolutionManagement.repositoriesMode = FAIL_ON_PROJECT_REPOS`.
//   * `repositories` for PLUGIN resolution live in `settings.gradle` under
//     `pluginManagement.repositories`.
//   * The Android Gradle Plugin is pinned in `settings.gradle` via
//     `pluginManagement.plugins`, so this file no longer needs a `buildscript`
//     block at all.
//
// This avoids the "no repositories are defined" / "repository X was added by
// build file" build errors that occur when the two repository layers overlap.

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
